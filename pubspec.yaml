name: assistente_financeiro
description: "Assistente Financeiro IA - Gerencie seus gastos com inteligência artificial"
publish_to: 'none'

version: 1.0.9+7

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  get: ^4.6.6
  
  # UI & Design
  flutter_screenutil: ^5.9.3
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.3.0
  
  # Data & Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Networking & API
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  http: ^1.1.0
  
  # Utilities
  intl: ^0.20.3
  equatable: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  
  # Firebase & Backend
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  firebase_performance: ^0.12.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  
  # Charts & Visualization
  fl_chart: ^1.3.0
  
  # Image Picker
  image_picker: ^1.0.7
  
  # Date & Time
  table_calendar: ^3.1.2
  
  # Icons
  cupertino_icons: ^2.0.0
  
  # Ads & Monetization
  google_mobile_ads: ^9.2.0
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/config/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#6A4DFF"
    theme_color: "#6A4DFF"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
